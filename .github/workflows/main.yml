name: CI/CD to Hugging Face Spaces

on:
  push:
    branches:
      - main
    paths:
      - "인공지능모델운영/2555038-2026.09.07/**"
      - ".github/workflows/main.yml"

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r "인공지능모델운영/2555038-2026.09.07/requirements.txt"

      - name: Run tests
        run: |
          cd "인공지능모델운영/2555038-2026.09.07"
          pytest -v

      - name: Build Docker image
        run: |
          docker build \
            -t ci-cd-demo:latest \
            "인공지능모델운영/2555038-2026.09.07"

      - name: Deploy to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git clone https://user:$HF_TOKEN@huggingface.co/spaces/Arrsssa/2555038-2026.09.07 hf-space

          rsync -av --delete \
            --exclude='.git/' \
            --exclude='images/' \
            "인공지능모델운영/2555038-2026.09.07/" \
            hf-space/

          cd hf-space

          git config user.email "github-actions@github.com"
          git config user.name "github-actions"

          git add -A
          git commit -m "Deploy from GitHub Actions" || echo "No changes"
          git push
