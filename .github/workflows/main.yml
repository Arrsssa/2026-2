name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - main
    paths:
      - "인공지능모델운영/2555038-2026.09.07/**"
      - ".github/workflows/main.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git clone https://user:$HF_TOKEN@huggingface.co/spaces/Arrsssa/2555038-2026.09.07 hf-space

          rsync -av --delete \
            --exclude='.git/' \
            --exclude='images/' \
            "인공지능모델운영/2555038-2026.09.07/" \
            hf-space/

          cd hf-space

          git config user.email "github-actions@github.com"
          git config user.name "github-actions"

          git add -A
          git commit -m "Deploy from GitHub" || echo "No changes"
          git push
